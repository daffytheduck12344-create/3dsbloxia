name: Build 3dsbloxia

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  DEVKITPRO: /opt/devkitpro
  DEVKITARM: /opt/devkitpro/devkitARM
  CTRULIB: /opt/devkitpro/libctru
  PATH: /opt/devkitpro/devkitARM/bin:/opt/devkitpro/tools/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: devkitpro/devkitarm:latest

    steps:
      - name: Checkout 3dsbloxia
        uses: actions/checkout@v4

      - name: Create source fallback
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p source
          if ! find source -maxdepth 2 -type f \
            \( -name '*.c' -o -name '*.cpp' -o -name '*.s' \) \
            -print -quit | grep -q .; then
            cat > source/main.cpp <<'EOF'
          #include <3ds.h>
          #include <stdio.h>

          int main(void) {
            gfxInitDefault();
            consoleInit(GFX_TOP, NULL);

            printf("3dsbloxia ready\nPress START to exit\n");

            while (aptMainLoop()) {
              hidScanInput();
              if (hidKeysDown() & KEY_START) break;

              gfxFlushBuffers();
              gfxSwapBuffers();
              gspWaitForVBlank();
            }

            gfxExit();
            return 0;
          }
          EOF
          fi

      - name: Verify 3dsbloxia toolchain
        shell: bash
        run: |
          set -euo pipefail
          test -x "${DEVKITARM}/bin/arm-none-eabi-gcc"
          test -d "${DEVKITPRO}/libctru/include"
          arm-none-eabi-gcc --version
          make --version | head -n 1

      - name: Clean and compile 3dsbloxia
        shell: bash
        run: |
          set -euo pipefail
          make clean
          make -j"$(nproc)"

      - name: Verify 3dsbloxia outputs
        shell: bash
        run: |
          set -euo pipefail
          test -f 3dsblox.3dsx
          ls -lh 3dsblox.3dsx
          if [ -f 3dsblox.elf ]; then ls -lh 3dsblox.elf; fi
          if [ -f 3dsblox.smdh ]; then ls -lh 3dsblox.smdh; fi

      - name: Stage 3dsbloxia artifacts
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist
          cp -v 3dsblox.3dsx dist/
          if [ -f 3dsblox.smdh ]; then cp -v 3dsblox.smdh dist/; fi
          if [ -f 3dsblox.elf ]; then cp -v 3dsblox.elf dist/; fi

      - name: Upload 3dsbloxia artifacts
        uses: actions/upload-artifact@v4
        with:
          name: 3dsbloxia-3ds
          path: dist/
          if-no-files-found: error
