name: Build 3dsbloxia

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  DEVKITPRO: /opt/devkitpro
  DEVKITARM: /opt/devkitpro/devkitARM
  CTRULIB: /opt/devkitpro/libctru
  PATH: /opt/devkitpro/devkitARM/bin:/opt/devkitpro/tools/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: devkitpro/devkitarm:latest

    steps:
      - name: Checkout 3dsbloxia
        uses: actions/checkout@v4

      - name: Remove duplicate fallback source
        shell: bash
        run: |
          set -euo pipefail
          rm -f source/main.cpp
          test -f source/main.c

      - name: Verify 3dsbloxia toolchain
        shell: bash
        run: |
          set -euo pipefail

          echo "DEVKITPRO=${DEVKITPRO}"
          echo "DEVKITARM=${DEVKITARM}"
          echo "CTRULIB=${CTRULIB}"
          echo "PATH=${PATH}"

          if [[ ! -x "${DEVKITARM}/bin/arm-none-eabi-gcc" ]]; then
            echo "ERROR: ARM compiler not found or not executable:"
            echo "${DEVKITARM}/bin/arm-none-eabi-gcc"
            ls -la "${DEVKITARM}/bin" || true
            command -v arm-none-eabi-gcc || true
            exit 1
          fi

          if [[ ! -f "${DEVKITARM}/3ds_rules" ]]; then
            echo "ERROR: devkitARM build rules not found:"
            echo "${DEVKITARM}/3ds_rules"
            ls -la "${DEVKITARM}" || true
            exit 1
          fi

          if [[ ! -d "${CTRULIB}/include" ]]; then
            echo "ERROR: libctru headers not found:"
            echo "${CTRULIB}/include"
            ls -la "${DEVKITPRO}" || true
            exit 1
          fi

          arm-none-eabi-gcc -dumpmachine
          arm-none-eabi-gcc -dumpversion
          make --no-print-directory --version >/dev/null

      - name: Clean and compile 3dsbloxia
        shell: bash
        run: |
          set -euo pipefail
          make clean
          make -j"$(nproc)"

      - name: Verify 3dsbloxia outputs
        shell: bash
        run: |
          set -euo pipefail
          test -f 3dsblox.3dsx
          ls -lh 3dsblox.3dsx
          if [ -f 3dsblox.elf ]; then ls -lh 3dsblox.elf; fi
          if [ -f 3dsblox.smdh ]; then ls -lh 3dsblox.smdh; fi

      - name: Stage 3dsbloxia artifacts
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist
          cp -v 3dsblox.3dsx dist/
          if [ -f 3dsblox.smdh ]; then cp -v 3dsblox.smdh dist/; fi
          if [ -f 3dsblox.elf ]; then cp -v 3dsblox.elf dist/; fi

      - name: Upload 3dsbloxia artifacts
        uses: actions/upload-artifact@v4
        with:
          name: 3dsbloxia-3ds
          path: dist/
          if-no-files-found: error
