name: Build Nintendo 3DS homebrew

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Ensure starter source exists if source/ is empty
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p source
          if [ -z "$(find source -maxdepth 2 -type f \( -name '*.c' -o -name '*.cpp' -o -name '*.s' \))" ]; then
            printf '%s\n' \
              '#include <3ds.h>' \
              '#include <stdio.h>' \
              '' \
              'int main(int argc, char** argv) {' \
              '    (void)argc;' \
              '    (void)argv;' \
              '    gfxInitDefault();' \
              '    consoleInit(GFX_TOP, NULL);' \
              '    printf("3dsblox booted!\nPress START to exit.\n");' \
              '    while (aptMainLoop()) {' \
              '        hidScanInput();' \
              '        if (hidKeysDown() & KEY_START) break;' \
              '        gfxFlushBuffers();' \
              '        gfxSwapBuffers();' \
              '        gspWaitForVBlank();' \
              '    }' \
              '    gfxExit();' \
              '    return 0;' \
              '}' > source/main.cpp
          fi

      - name: Install 3DS libraries
        shell: bash
        run: |
          set -euo pipefail
          dkp-pacman -Syu --noconfirm
          dkp-pacman -S --needed --noconfirm 3ds-dev

      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          export DEVKITPRO=/opt/devkitpro
          export DEVKITARM=/opt/devkitpro/devkitARM
          export CTRULIB=/opt/devkitpro/libctru
          export PATH="$DEVKITARM/bin:$DEVKITPRO/tools/bin:$PATH"
          make -j"$(nproc)"

      - name: Collect build artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp -v 3dsblox.3dsx dist/
          [ -f 3dsblox.smdh ] && cp -v 3dsblox.smdh dist/ || true
          [ -f 3dsblox.elf ] && cp -v 3dsblox.elf dist/ || true

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: 3dsblox-build
          path: dist/
          if-no-files-found: error
