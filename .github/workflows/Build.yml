name: Build Nintendo 3DS homebrew

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  DEVKITPRO: /opt/devkitpro
  DEVKITARM: /opt/devkitpro/devkitARM
  CTRULIB: /opt/devkitpro/libctru
  PATH: /opt/devkitpro/devkitARM/bin:/opt/devkitpro/tools/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install 3DS libraries
        shell: bash
        run: |
          set -euo pipefail
          dkp-pacman -Syu --noconfirm
          dkp-pacman -S --needed --noconfirm 3ds-dev

      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          test -f "$DEVKITARM/base_rules"
          arm-none-eabi-gcc --version
          make -j"$(nproc)"

      - name: Collect build artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          ls -la
          find . -maxdepth 4 -type f \
            \( -name '3dsblox.3dsx' -o -name '3dsblox.cia' \
               -o -name '3dsblox.elf' -o -name '3dsblox.smdh' \) \
            -exec cp -v {} dist/ \;

          if [ ! -f dist/3dsblox.3dsx ]; then
            echo "Expected 3dsblox.3dsx was not produced."
            exit 1
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: 3dsblox-build
          path: dist/
          if-no-files-found: error
